<div class="profile-container">
  @if (currentUser$ | async; as user) {
    <div class="user-info">
      <div class="user-row">
        <button
          class="avatar"
          [style.background-color]="user.avatarColor || '#3b82f6'"
          (click)="togglePicker($event)"
          aria-label="Change avatar color"
        >
          {{ user.username | initial }}
        </button>
        <strong class="username">{{ user.username }}</strong>

        @if (pickerOpen) {
          <app-color-picker
            [selected]="user.avatarColor"
            (colorChange)="chooseColor($event)"
            (close)="pickerOpen = false"
          />
        }
      </div>

      <button class="btn-logout" (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  } @else {
    <div class="profile-actions">
      <button class="btn-login" routerLink="/login">
        <mat-icon>login</mat-icon>
        Login
      </button>
      <button class="btn-register" routerLink="/register">
        <mat-icon>person_add</mat-icon>
        Register
      </button>
    </div>
  }
  <div class="divider"></div>
</div>
