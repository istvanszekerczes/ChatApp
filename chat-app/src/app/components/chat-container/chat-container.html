@if (activeChat(); as chat) {
    <div class="messages-scroll">
        @if (loading()) {
            <p class="placeholder">Loading messages…</p>
        } @else {
            @for (msg of messages(); track msg.id) {
                <app-message-item [message]="msg" />
            } @empty {
                <p class="placeholder">No messages yet. Say something.</p>
            }
        }
        <div #scrollAnchor></div>
    </div>

    <div class="input-container">
        <input
            type="text"
            placeholder="Type a message..."
            [(ngModel)]="messageText"
            (keyup.enter)="send()" />
        <button
            [disabled]="!messageText.trim()"
            (click)="send()"
            aria-label="Send message">
            <mat-icon>send</mat-icon>
        </button>
    </div>
} @else {
    <p class="placeholder centered">Pick a chat to start messaging</p>
}
