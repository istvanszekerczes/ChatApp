<div class="color-picker" [class.flat]="flat()">
    @for (color of colors; track color) {
        <button
            class="color-swatch"
            [style.background-color]="color"
            [class.selected]="color === selected()"
            (click)="colorChange.emit(color)"
            aria-label="Set color">
        </button>
    }
</div>
