<div class="dialog">
    <div class="dialog-body">
        <input
            type="text"
            placeholder="Search users..."
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)" />

        <ul class="user-list">
            @for (u of candidates(); track u.id) {
                <li>
                    <button class="user-item"  [class.active]="selectedUser()?.id === u.id" (click)="selectUser(u)">
                        <span class="avatar" [style.background-color]="u.avatarColor || '#3b82f6'">
                            {{ u.username | initial }}
                        </span>
                        <span class="user-name">{{ u.username }}</span>
                    </button>
                </li>
            } @empty {
                <li class="hint">No users found.</li>
            }
        </ul>
    </div>

    @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
    }
</div>
