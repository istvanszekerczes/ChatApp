<div class="button-container">
    <button
        [class.active]="activeTab() === 'all'"
        (click)="setTab('all')">
        <span>All</span>
    </button>
    <button
        [class.active]="activeTab() === 'groups'"
        (click)="setTab('groups')">
        <span>Groups</span>
    </button>
    <button
        [class.active]="activeTab() === 'direct'"
        (click)="setTab('direct')">
        <span>Direct</span>
    </button>
</div>
