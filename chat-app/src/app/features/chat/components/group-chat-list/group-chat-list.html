<div class="group-chat-container">
    <button
        class="public-chat"
        [class.active]="activeFilter() === 'PUBLIC_GROUP'"
        (click)="setFilter('PUBLIC_GROUP')">
        <mat-icon>public</mat-icon>
        <span>Public Chats</span>
    </button>
    <button
        class="private-chat"
        [class.active]="activeFilter() === 'PRIVATE_GROUP'"
        (click)="setFilter('PRIVATE_GROUP')">
        <mat-icon>lock_open</mat-icon>
        <span>Private Chats</span>
    </button>
    <button
        class="protected-chat"
        [class.active]="activeFilter() === 'PROTECTED_GROUP'"
        (click)="setFilter('PROTECTED_GROUP')">
        <mat-icon>lock</mat-icon>
        <span>Protected Chats</span>
    </button>
</div>

<div class="search-container">
    <mat-icon class="search-icon">search</mat-icon>
    <input
        type="text"
        placeholder="Search chats..."
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchChange($event)" />
    @if (searchTerm()) {
        <button class="clear-search" (click)="clearSearch()" aria-label="Clear search">
            <mat-icon>close</mat-icon>
        </button>
    }
</div>

<ul class="chat-list">
    @for (chat of visibleChats(); track chat.id) {
        <li>
            <app-chat-item
                [chat]="chat"
                [active]="activeChat()?.id === chat.id"
                (select)="selectChat($event)" />
        </li>
    } @empty {
        <li class="empty">
            @if (loading()) {
                Loading…
            } @else if (searchTerm()) {
                No matching chats
            } @else {
                No chats here yet
            }
        </li>
    }
</ul>

<div class="divider"></div>
