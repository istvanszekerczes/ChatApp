<div class="input-container">
  <button class="emoji-button" (click)="showEmojiPicker = !showEmojiPicker" aria-label="Add emoji">
    <mat-icon>mood</mat-icon>
  </button>
  @if (showEmojiPicker) {
    <app-emoji-picker (emojiSelect)="onEmojiSelect($event)" (close)="showEmojiPicker = false" />
  }
  <textarea
    #messageInput
    id="messageInput"
    matInput
    cdkTextareaAutosize
    #autosize="cdkTextareaAutosize"
    cdkAutosizeMinRows="1"
    cdkAutosizeMaxRows="5"
    placeholder="Type a message..."
    [(ngModel)]="messageText"
    (keydown.enter)="onEnter($event)"
>
  </textarea>
  <button
    mat-icon-button
    [disabled]="!messageText.trim()"
    (click)="onSend()"
    aria-label="Send message"
  >
    <mat-icon>send</mat-icon>
  </button>
</div>
