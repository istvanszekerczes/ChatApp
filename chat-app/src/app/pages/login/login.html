<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue to your chats</p>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="create-chat-button submit-btn">
        <span>Sign In</span>
      </button>
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-auth">
      <a href="http://localhost:3000/auth/google" class="create-chat-button social-btn">
        <span>Continue with Google</span>
      </a>
      <a href="http://localhost:3000/auth/facebook" class="create-chat-button social-btn">
        <span>Continue with Facebook</span>
      </a>
    </div>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
    <p class="auth-footer">
      <a routerLink="">Back to ChatApp </a>
    </p>
  </div>
</div>
